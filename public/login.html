<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Ritesh Singh Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="align-items:center; justify-content:center;">
  <div class="login-container">
    <div class="login-header">
      <div class="auth-kicker">[RITESH SINGH // CMS CONTROL]</div>
      <h1>PORTAL ACCESS<span>®</span></h1>
      <p>Secure authentication for Ritesh Singh</p>
    </div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom:16px;">
        <label for="username">Admin Username</label>
        <input id="username" type="text" required placeholder="admin" autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom:24px;">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
        <small style="color:var(--admin-dim); font-size:11px; margin-top:4px;">Default setup: ritesh2026</small>
      </div>

      <button class="btn btn-primary" type="submit" id="loginBtn" style="width:100%; justify-content:center; padding:12px;">
        Authenticate &amp; Enter Dashboard →
      </button>

      <div id="loginError" style="margin-top:16px; color:var(--admin-rose); font-size:12px; text-align:center;" hidden></div>
    </form>

    <div style="margin-top:28px; text-align:center; border-top:1px solid var(--admin-border); padding-top:18px;">
      <a href="/" style="font-size:12px; color:var(--admin-muted); text-decoration:none;">← Return to Public Portfolio</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    // If already logged in, verify token
    const existingToken = localStorage.getItem('admin_token');
    if (existingToken) {
      fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${existingToken}` } })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(() => { window.location.href = '/admin'; })
        .catch(() => localStorage.removeItem('admin_token'));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Authenticating…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed');

        localStorage.setItem('admin_token', data.token);
        window.location.href = '/admin';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Authenticate & Enter Dashboard →';
      }
    });
  </script>
</body>
</html>
