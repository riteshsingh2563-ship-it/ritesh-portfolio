<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#grad)" />
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>
  <!-- Ambient light orb -->
  <circle cx="680" cy="120" r="140" fill="#10b981" opacity="0.2" filter="url(#blurFilter)" />
  <circle cx="120" cy="360" r="120" fill="#10b981" opacity="0.12" filter="url(#blurFilter)" />

  <!-- Mockup frame -->
  <rect x="50" y="45" width="700" height="360" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <rect x="50" y="45" width="700" height="42" rx="12" fill="rgba(255,255,255,0.03)" />
  <!-- Window dots -->
  <circle cx="75" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="95" cy="66" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="115" cy="66" r="5" fill="#22c55e" opacity="0.8" />
  <text x="140" y="70" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1">PROJECT SHOWCASE // 2026</text>

  <!-- Content -->
  <g transform="translate(85, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="12" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">REST API & CLI</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-family="'Anton', 'Impact', sans-serif" font-size="52" letter-spacing="2">FREELLM API</text>
    
    <!-- Subtitle -->
    <text x="0" y="112" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="17">AI Model Proxy & Developer Interface</text>

    <!-- Visual status line -->
    <line x1="0" y1="145" x2="630" y2="145" stroke="url(#glow)" stroke-width="2" />
    
    <text x="0" y="180" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12">STATUS: PRODUCTION READY  ·  AUTHOR: RITESH SINGH</text>
  </g>
</svg>